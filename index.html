<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dark Player</title>
  <style>
    body {
      margin: 0;
      background: #0b0b0b;
      color: #e5e5e5;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .player {
      background: #111;
      border: 1px solid #2a0000;
      box-shadow: 0 0 30px rgba(180, 0, 0, 0.3);
      border-radius: 12px;
      padding: 16px;
      width: 360px;
    }
    .controls {
      text-align: center;
      font-size: 18px;
      margin-bottom: 6px;
      color: #b30000;
    }
    .link {
      text-align: center;
      font-size: 13px;
      margin-top: 6px;
    }
    .link a {
      color: #ff3b3b;
      text-decoration: none;
    }
    .link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="player">

    <iframe
      src="https://www.tiktok.com/embed/v2/7599994713558600982"
      width="100%"
      height="420"
      style="border-radius:8px; border:none; margin-bottom:12px;"
      allowfullscreen>
    </iframe>

    <div class="controls">
      ⏮ ⏯ ⏭ ━━━●──── 🔊
    </div>

    <div class="link">
      🖤🩸
      <a href="https://www.tiktok.com/@kuzaro__/video/7599994713558600982" target="_blank">
        ver o vídeo completo
      </a>
    </div>

  </div>
</body>
</html>
